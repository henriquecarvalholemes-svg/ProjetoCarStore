<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Store</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="cabecalho">
        <h3>Cadastre seu veículo para vender mais rápido</h3>
    </header>
    <div class="form-container">
        <div class="form-header">
            <p>Formulário</p>
        </div>

        <div class="form-body">
            <h1 class="titulo-form">Venda fácil seu carro</h1>
            <p>Descreva as características dos seus carros e marque os opcionais que ele possui</p>
            <form onsubmit="salvarCarros(event)">
                <div class="caixaInputs">
                    <label for="tittle">Título do Anúncio <span class="campo-obrigatorio">*</span></label>
                    <input type="text" name="tittle" id="title" class="block" placeholder="Um título para anunciar seu carro">
                </div>
                <div class="caixaInputs">
                    <label for="preco">preço <span class="campo-obrigatorio">*</span></label>
                    <input type="number" name="preco" id="preco" class="block" placeholder="Defina o preço">
                </div>
                <div class="caixaInputs">

                    <label for="descricao">descrição <span class="campo-obrigatorio">*</span></label>
                    <textarea name="descricao" id="descricao" class="block" placeholder="Faça a descrição de seu veículo"></textarea>
                </div>
                <div class="caixaInputs">

                    <label for="marca">marca <span class="campo-obrigatorio">*</span></label>
                    <input type="text" name= "marca" id="marca" class="block" placeholder="Marca do veículo"></input>
                </div>
                <div class="caixaInputs">

                    <label for="modelo">Modelo <span class="campo-obrigatorio">*</span></label>
                    <input type="text" name= "modelo" id="modelo" class="block" placeholder="Modelo do veículo"></input>
                </div>
                 <div class="caixaInputs">

                    <label for="quilometragem">Quilometragem <span class="campo-obrigatorio">*</span></label>
                    <input type="number" name= "quilometragem" id="quilometragem" class="block" placeholder="Quilometragem do veículo"></input>
                </div>
                 <div class="caixaInputs">

                    <label for="data-de-compra">Data de compra <span class="campo-obrigatorio">*</span></label>
                    <input type="date" name= "data-de-compra" id="data-de-compra" class="block"></input>
                </div>

                    <div class="caixaInputs">

                    <p>Tipo de Câmbio: <span class="campo-obrigatorio">*</span></p> 
                    <input type="radio" name= "marcha" id="manual"> <label for="manual">Manual</label>
                    <input type="radio" name= "marcha" id="auto"> <label for="auto">Automático</label>
                </div>
                    <div class="caixaOpcional">
                        <p>Opcionais</p>
                        <ul class="listaOpcionais">
                            <li>
                                <input type="checkbox" name="opcional[]" id="airbag" value="airbag"> <label for="airbag">Airbag</label>
                            </li>
                            <li>
                                <input type="checkbox" name="opcional[]" id="alarme" value="alarme"> <label for="alarme">Alarme</label>
                            </li>
                            <li>
                                <input type="checkbox" name="opcional[]" id="ar-condicionado" value="ar-condicionado"> <label for="ar-condicionado">Ar Condicionado</label>
                            </li>
                            <li>
                                <input type="checkbox" name="opcional[]" id="camera-de-re" value="camera-de-re"> <label for="camera-de-re">Câmera de Ré</label>
                            </li>
                        </ul>
                    </div>
                       <div class="caixaInputs">
                        
                        <ul class="listaOpcionais">
                            <li>
                                <input type="checkbox" name="opcional[]" id="assistente-de-pista" value="assistente-de-pista"> <label for="assistente-de-pista">Assitente de Pista</label>
                            </li>
                            <li>
                                <input type="checkbox" name="opcional[]" id="Partida-sem-chave" value="Partida-sem-chave"> <label for="Partida-sem-chave">Partida sem Chave</label>
                            </li>
                            <li>
                                <input type="checkbox" name="opcional[]" id="Integracao-com-celular" value="Integracao-com-celular"> <label for="Integracao-com-celular">Integração com celular</label>
                            </li>
                                <li>
                                <input type="checkbox" name="opcional[]" id="banco-de-couro" value="banco-de-couro"> <label for="banco-de-couro">Banco de Couro</label>
                            </li>
                        </ul>
                    </div>  
                        <div class="caixaInputs">
                            <p>Fotos do carro <span class="campo-obrigatorio">*</span></p>
                            <input type="file" name="imagem" id="imagem" multiple accept="image/png, image/jpg">
                        </div>
                        <input type="submit" value="Enviar" class="btn-submit">
                </form>
                <hr>
                <h2>Carros Cadastrados</h2>
                <div id="listarCarros"></div>
        </div>
    </div>
    <script src="script/script.js"></script>
</body>
</html>
